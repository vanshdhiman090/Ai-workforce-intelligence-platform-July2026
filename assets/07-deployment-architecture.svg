<svg width="1100" height="650" viewBox="0 0 1100 650" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0B1120"/>
      <stop offset="100%" stop-color="#060911"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="1100" height="650" fill="url(#bg)"/>
  <rect x="0" y="0" width="1100" height="4" fill="#2563EB"/>

  <text x="550" y="50" text-anchor="middle" font-size="15" letter-spacing="3" fill="#22D3EE" font-weight="bold">DEPLOYMENT ARCHITECTURE</text>

  <!-- 1 Developer -->
  <rect x="300" y="90" width="300" height="70" rx="10" fill="#111827" stroke="#1E293B" stroke-width="0.75"/>
  <text x="450" y="132" text-anchor="middle" font-size="15" font-weight="bold" fill="#FFFFFF">Developer</text>

  <line x1="450" y1="160" x2="450" y2="200" stroke="#22D3EE" stroke-width="2"/>
  <polygon points="443,200 450,213 457,200" fill="#22D3EE"/>

  <!-- 2 GitHub Repository -->
  <rect x="300" y="220" width="300" height="70" rx="10" fill="#111827" stroke="#475569" stroke-width="1" stroke-dasharray="5 4"/>
  <text x="450" y="262" text-anchor="middle" font-size="15" font-weight="bold" fill="#FFFFFF">GitHub Repository</text>

  <line x1="450" y1="290" x2="450" y2="330" stroke="#22D3EE" stroke-width="2"/>
  <polygon points="443,330 450,343 457,330" fill="#22D3EE"/>

  <!-- 3 Streamlit Community Cloud -->
  <rect x="300" y="350" width="300" height="70" rx="10" fill="#111827" stroke="#475569" stroke-width="1" stroke-dasharray="5 4"/>
  <text x="450" y="392" text-anchor="middle" font-size="15" font-weight="bold" fill="#FFFFFF">Streamlit Community Cloud</text>

  <line x1="450" y1="420" x2="450" y2="460" stroke="#22D3EE" stroke-width="2"/>
  <polygon points="443,460 450,473 457,460" fill="#22D3EE"/>

  <!-- 4 Neon PostgreSQL -->
  <rect x="300" y="480" width="300" height="70" rx="10" fill="#111827" stroke="#475569" stroke-width="1" stroke-dasharray="5 4"/>
  <text x="450" y="522" text-anchor="middle" font-size="15" font-weight="bold" fill="#FFFFFF">Neon PostgreSQL</text>

  <!-- Gemini API side branch off Streamlit (runtime intelligence layer, not deployment infra) -->
  <text x="850" y="378" text-anchor="middle" font-size="11" fill="#64748B">runtime API call</text>
  <line x1="600" y1="385" x2="758" y2="385" stroke="#22D3EE" stroke-width="2"/>
  <polygon points="758,378 771,385 758,392" fill="#22D3EE"/>
  <rect x="780" y="350" width="260" height="70" rx="10" fill="#111827" stroke="#8B5CF6" stroke-width="1" stroke-dasharray="5 4"/>
  <text x="910" y="378" text-anchor="middle" font-size="15" font-weight="bold" fill="#FFFFFF">Gemini API</text>
  <text x="910" y="400" text-anchor="middle" font-size="11" fill="#94A3B8">Intelligence layer, not deploy infra</text>

  <!-- Legend -->
  <line x1="300" y1="595" x2="340" y2="595" stroke="#475569" stroke-width="1" stroke-dasharray="5 4"/>
  <text x="348" y="599" font-size="12" fill="#64748B">external managed service</text>
  <line x1="580" y1="595" x2="620" y2="595" stroke="#1E293B" stroke-width="1"/>
  <text x="628" y="599" font-size="12" fill="#64748B">project code / activity</text>
</svg>
