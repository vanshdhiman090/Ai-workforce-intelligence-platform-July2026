  <line x1="500" y1="290" x2="500" y2="330" stroke="#22D3EE" stroke-width="2"/>
  <polygon points="493,330 500,343 507,330" fill="#22D3EE"/>

  <!-- 3 Verified Metrics (highlighted) -->
  <rect x="340" y="350" width="320" height="70" rx="10" fill="#111827" stroke="#22D3EE" stroke-width="1.25"/>
