  <rect x="775" y="928" width="200" height="50" rx="8" fill="#111827" stroke="#8B5CF6" stroke-width="1" stroke-dasharray="5 4"/>
  <text x="875" y="953" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF">Gemini explanation layer</text>
