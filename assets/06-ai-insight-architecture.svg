<svg width="1000" height="1020" viewBox="0 0 1000 1020" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0B1120"/>
      <stop offset="100%" stop-color="#060911"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="1000" height="1020" fill="url(#bg)"/>
  <rect x="0" y="0" width="1000" height="4" fill="#2563EB"/>

  <text x="500" y="50" text-anchor="middle" font-size="15" letter-spacing="3" fill="#22D3EE" font-weight="bold">AI EXECUTIVE INSIGHT ARCHITECTURE</text>

  <!-- 1 SQL Queries -->
  <rect x="340" y="90" width="320" height="70" rx="10" fill="#111827" stroke="#1E293B" stroke-width="0.75"/>
  <text x="500" y="132" text-anchor="middle" font-size="15" font-weight="bold" fill="#FFFFFF">SQL Queries</text>

  <line x1="500" y1="160" x2="500" y2="200" stroke="#22D3EE" stroke-width="2"/>
  <polygon points="493,200 500,213 507,200" fill="#22D3EE"/>

  <!-- 2 Python Calculations -->
  <rect x="340" y="220" width="320" height="70" rx="10" fill="#111827" stroke="#1E293B" stroke-width="0.75"/>
