  <line x1="500" y1="420" x2="500" y2="460" stroke="#22D3EE" stroke-width="2"/>
  <polygon points="493,460 500,473 507,460" fill="#22D3EE"/>

  <!-- 4 Prompt Construction -->
  <rect x="340" y="480" width="320" height="70" rx="10" fill="#111827" stroke="#1E293B" stroke-width="0.75"/>
  <text x="500" y="522" text-anchor="middle" font-size="15" font-weight="bold" fill="#FFFFFF">Prompt Construction</text>

  <line x1="500" y1="550" x2="500" y2="590" stroke="#22D3EE" stroke-width="2"/>
  <polygon points="493,590 500,603 507,590" fill="#22D3EE"/>

  <!-- 5 Gemini -->
  <rect x="340" y="610" width="320" height="70" rx="10" fill="#111827" stroke="#8B5CF6" stroke-width="1" stroke-dasharray="5 4"/>
  <text x="500" y="652" text-anchor="middle" font-size="15" font-weight="bold" fill="#FFFFFF">Gemini</text>

  <line x1="500" y1="680" x2="500" y2="720" stroke="#22D3EE" stroke-width="2"/>
  <polygon points="493,720 500,733 507,720" fill="#22D3EE"/>

  <!-- 6 Executive Narrative -->
  <rect x="340" y="740" width="320" height="70" rx="10" fill="#111827" stroke="#1E293B" stroke-width="0.75"/>
  <text x="500" y="782" text-anchor="middle" font-size="15" font-weight="bold" fill="#FFFFFF">Executive Narrative</text>

  <!-- Callout -->
  <rect x="250" y="828" width="500" height="42" rx="8" fill="#0F1B2E" stroke="#22D3EE" stroke-width="0.75"/>
  <text x="500" y="849" text-anchor="middle" font-size="12" fill="#67E8F9" font-style="italic">The AI never calculates statistics</text>

  <!-- Core principle mini-strip -->
