  <line x1="255" y1="953" x2="283" y2="953" stroke="#22D3EE" stroke-width="1.5"/>
  <polygon points="283,947 293,953 283,959" fill="#22D3EE"/>

  <rect x="295" y="928" width="200" height="50" rx="8" fill="#111827" stroke="#1E293B" stroke-width="0.75"/>
