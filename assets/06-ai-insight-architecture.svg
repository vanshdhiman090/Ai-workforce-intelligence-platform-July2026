  <line x1="495" y1="953" x2="523" y2="953" stroke="#22D3EE" stroke-width="1.5"/>
  <polygon points="523,947 533,953 523,959" fill="#22D3EE"/>

  <rect x="535" y="928" width="200" height="50" rx="8" fill="#111827" stroke="#22D3EE" stroke-width="1"/>
  <text x="635" y="953" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF">Verified metrics</text>

  <line x1="735" y1="953" x2="763" y2="953" stroke="#22D3EE" stroke-width="1.5"/>
