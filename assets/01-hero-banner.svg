  <line x1="322" y1="565" x2="360" y2="565" stroke="#22D3EE" stroke-width="2"/>
  <polygon points="360,558 373,565 360,572" fill="#22D3EE"/>

  <line x1="627" y1="565" x2="665" y2="565" stroke="#22D3EE" stroke-width="2"/>
  <polygon points="665,558 678,565 665,572" fill="#22D3EE"/>

  <line x1="932" y1="565" x2="970" y2="565" stroke="#22D3EE" stroke-width="2"/>
  <polygon points="970,558 983,565 970,572" fill="#22D3EE"/>

  <line x1="1237" y1="565" x2="1275" y2="565" stroke="#22D3EE" stroke-width="2"/>
