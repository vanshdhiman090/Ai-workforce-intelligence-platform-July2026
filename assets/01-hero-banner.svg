<svg width="1600" height="900" viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0B1120"/>
      <stop offset="100%" stop-color="#060911"/>
    </linearGradient>
    <linearGradient id="accentBar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#22D3EE"/>
    </linearGradient>
    <radialGradient id="glow1" cx="85%" cy="10%" r="55%">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="10%" cy="95%" r="55%">
      <stop offset="0%" stop-color="#2563EB" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#2563EB" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect x="0" y="0" width="1600" height="900" fill="url(#bg)"/>
  <rect x="0" y="0" width="1600" height="900" fill="url(#glow1)"/>
  <rect x="0" y="0" width="1600" height="900" fill="url(#glow2)"/>
  <rect x="0" y="0" width="1600" height="4" fill="url(#accentBar)"/>
  <rect x="0" y="896" width="1600" height="4" fill="url(#accentBar)"/>

  <text x="800" y="72" text-anchor="middle" font-size="15" letter-spacing="3" fill="#22D3EE" font-weight="bold">PRODUCTION-GRADE DATA ENGINEERING PLATFORM</text>

  <text x="800" y="168" text-anchor="middle" font-size="58" font-weight="bold" fill="#FFFFFF">AI Workforce Intelligence Platform</text>

  <text x="800" y="216" text-anchor="middle" font-size="26" fill="#38BDF8">Transparent AI-powered workforce intelligence for the German job market</text>

  <text x="800" y="256" text-anchor="middle" font-size="17" fill="#94A3B8">Analyze live job market data to identify in-demand skills, company skill gaps,</text>
  <text x="800" y="281" text-anchor="middle" font-size="17" fill="#94A3B8">and hiring trends through an end-to-end data engineering pipeline</text>

  <line x1="120" y1="330" x2="1480" y2="330" stroke="#1E293B" stroke-width="1"/>

  <text x="800" y="368" text-anchor="middle" font-size="13" letter-spacing="2" fill="#64748B" font-weight="bold">TECH STACK</text>

