  <circle cx="276" cy="417" r="5" fill="#3776AB"/>
  <text x="292" y="417" dominant-baseline="central" font-size="14" font-weight="bold" fill="#E2E8F0">Python</text>

  <!-- Badge 2: PostgreSQL -->
  <rect x="476" y="395" width="200" height="44" rx="22" fill="#111827" stroke="#1E293B" stroke-width="0.75"/>
  <circle cx="500" cy="417" r="5" fill="#336791"/>
  <text x="516" y="417" dominant-baseline="central" font-size="14" font-weight="bold" fill="#E2E8F0">PostgreSQL</text>

  <!-- Badge 3: Streamlit -->
  <rect x="700" y="395" width="200" height="44" rx="22" fill="#111827" stroke="#1E293B" stroke-width="0.75"/>
  <circle cx="724" cy="417" r="5" fill="#FF4B4B"/>
  <text x="740" y="417" dominant-baseline="central" font-size="14" font-weight="bold" fill="#E2E8F0">Streamlit</text>

  <!-- Badge 4: Power BI -->
  <rect x="924" y="395" width="200" height="44" rx="22" fill="#111827" stroke="#1E293B" stroke-width="0.75"/>
  <circle cx="948" cy="417" r="5" fill="#F2C811"/>
  <text x="964" y="417" dominant-baseline="central" font-size="14" font-weight="bold" fill="#E2E8F0">Power BI</text>

  <!-- Badge 5: Gemini AI -->
  <rect x="1148" y="395" width="200" height="44" rx="22" fill="#111827" stroke="#1E293B" stroke-width="0.75"/>
  <circle cx="1172" cy="417" r="5" fill="#8B5CF6"/>
  <text x="1188" y="417" dominant-baseline="central" font-size="14" font-weight="bold" fill="#E2E8F0">Gemini API</text>

  <line x1="120" y1="470" x2="1480" y2="470" stroke="#1E293B" stroke-width="1"/>

  <text x="800" y="508" text-anchor="middle" font-size="13" letter-spacing="2" fill="#64748B" font-weight="bold">END-TO-END DATA PIPELINE</text>

