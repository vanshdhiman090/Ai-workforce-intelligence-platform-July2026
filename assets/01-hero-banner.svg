  <rect x="365" y="530" width="260" height="70" rx="10" fill="#111827" stroke="#1E293B" stroke-width="0.75"/>
  <text x="495" y="565" text-anchor="middle" dominant-baseline="central" font-size="15" font-weight="bold" fill="#FFFFFF">Data Pipeline</text>

  <rect x="670" y="530" width="260" height="70" rx="10" fill="#111827" stroke="#1E293B" stroke-width="0.75"/>
  <text x="800" y="565" text-anchor="middle" dominant-baseline="central" font-size="15" font-weight="bold" fill="#FFFFFF">PostgreSQL</text>

  <rect x="975" y="530" width="260" height="70" rx="10" fill="#111827" stroke="#1E293B" stroke-width="0.75"/>
  <text x="1105" y="565" text-anchor="middle" dominant-baseline="central" font-size="15" font-weight="bold" fill="#FFFFFF">Streamlit Dashboard</text>

  <rect x="1280" y="530" width="260" height="70" rx="10" fill="#111827" stroke="#22D3EE" stroke-width="1.25"/>
  <text x="1410" y="565" text-anchor="middle" dominant-baseline="central" font-size="15" font-weight="bold" fill="#FFFFFF">AI Executive Insights</text>

