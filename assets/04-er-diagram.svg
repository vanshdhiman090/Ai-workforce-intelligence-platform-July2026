<svg width="1550" height="450" viewBox="0 0 1550 450" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0B1120"/>
      <stop offset="100%" stop-color="#060911"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="1550" height="450" fill="url(#bg)"/>
  <rect x="0" y="0" width="1550" height="4" fill="#2563EB"/>

  <text x="775" y="50" text-anchor="middle" font-size="15" letter-spacing="3" fill="#22D3EE" font-weight="bold">DATABASE ER DIAGRAM</text>

  <!-- companies table -->
  <rect x="80" y="140" width="320" height="104" rx="10" fill="#111827" stroke="#1E293B" stroke-width="0.75"/>
  <rect x="80" y="140" width="320" height="40" rx="10" fill="#0F172A" stroke="#1E293B" stroke-width="0.75"/>
  <rect x="80" y="168" width="320" height="12" fill="#0F172A"/>
  <text x="100" y="165" font-size="15" font-weight="bold" fill="#FFFFFF">companies</text>
  <line x1="80" y1="212" x2="400" y2="212" stroke="#1E293B" stroke-width="0.75"/>
  <text x="100" y="200" font-size="13" fill="#FFFFFF">id</text>
  <text x="380" y="200" text-anchor="end" font-size="12" font-weight="bold" fill="#22D3EE">PK</text>
  <text x="100" y="232" font-size="13" fill="#94A3B8">company_name</text>

  <!-- connector companies -> jobs -->
  <line x1="400" y1="160" x2="598" y2="160" stroke="#22D3EE" stroke-width="1.5"/>
  <polygon points="598,153 611,160 598,167" fill="#22D3EE"/>
  <text x="415" y="150" font-size="12" fill="#64748B">1</text>
  <text x="580" y="150" font-size="12" fill="#64748B">N</text>

  <!-- jobs table -->
  <rect x="620" y="140" width="320" height="200" rx="10" fill="#111827" stroke="#1E293B" stroke-width="0.75"/>
  <rect x="620" y="140" width="320" height="40" rx="10" fill="#0F172A" stroke="#1E293B" stroke-width="0.75"/>
  <rect x="620" y="168" width="320" height="12" fill="#0F172A"/>
  <text x="640" y="165" font-size="15" font-weight="bold" fill="#FFFFFF">jobs</text>
  <line x1="620" y1="212" x2="940" y2="212" stroke="#1E293B" stroke-width="0.75"/>
  <text x="640" y="200" font-size="13" fill="#FFFFFF">id</text>
  <text x="920" y="200" text-anchor="end" font-size="12" font-weight="bold" fill="#22D3EE">PK</text>
  <text x="640" y="232" font-size="13" fill="#FFFFFF">company_id</text>
  <text x="920" y="232" text-anchor="end" font-size="12" font-weight="bold" fill="#F2C811">FK</text>
  <text x="640" y="264" font-size="13" fill="#94A3B8">title</text>
  <text x="640" y="296" font-size="13" fill="#94A3B8">category</text>
  <text x="640" y="328" font-size="13" fill="#94A3B8">posted_date</text>

  <!-- connector jobs -> job_skills -->
  <line x1="940" y1="160" x2="1138" y2="160" stroke="#22D3EE" stroke-width="1.5"/>
  <polygon points="1138,153 1151,160 1138,167" fill="#22D3EE"/>
  <text x="955" y="150" font-size="12" fill="#64748B">1</text>
  <text x="1120" y="150" font-size="12" fill="#64748B">N</text>

  <!-- job_skills table -->
  <rect x="1160" y="140" width="320" height="136" rx="10" fill="#111827" stroke="#1E293B" stroke-width="0.75"/>
  <rect x="1160" y="140" width="320" height="40" rx="10" fill="#0F172A" stroke="#1E293B" stroke-width="0.75"/>
  <rect x="1160" y="168" width="320" height="12" fill="#0F172A"/>
  <text x="1180" y="165" font-size="15" font-weight="bold" fill="#FFFFFF">job_skills</text>
  <line x1="1160" y1="212" x2="1480" y2="212" stroke="#1E293B" stroke-width="0.75"/>
  <text x="1180" y="200" font-size="13" fill="#FFFFFF">id</text>
  <text x="1460" y="200" text-anchor="end" font-size="12" font-weight="bold" fill="#22D3EE">PK</text>
  <text x="1180" y="232" font-size="13" fill="#FFFFFF">job_id</text>
  <text x="1460" y="232" text-anchor="end" font-size="12" font-weight="bold" fill="#F2C811">FK</text>
  <text x="1180" y="264" font-size="13" fill="#94A3B8">skill_name</text>

  <text x="775" y="410" text-anchor="middle" font-size="12" fill="#64748B">No separate skills table &#8212; skill_name is stored directly on job_skills</text>
</svg>
