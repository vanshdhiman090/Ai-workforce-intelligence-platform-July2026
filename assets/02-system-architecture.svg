<svg width="1200" height="920" viewBox="0 0 1200 920" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0B1120"/>
      <stop offset="100%" stop-color="#060911"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="1200" height="920" fill="url(#bg)"/>
  <rect x="0" y="0" width="1200" height="4" fill="#2563EB"/>

  <text x="600" y="50" text-anchor="middle" font-size="15" letter-spacing="3" fill="#22D3EE" font-weight="bold">SYSTEM ARCHITECTURE</text>

  <!-- 1 Adzuna API (external, dashed) -->
  <rect x="370" y="90" width="280" height="76" rx="10" fill="#111827" stroke="#475569" stroke-width="1" stroke-dasharray="5 4"/>
  <text x="510" y="118" text-anchor="middle" font-size="15" font-weight="bold" fill="#FFFFFF">Adzuna API</text>
  <text x="510" y="142" text-anchor="middle" font-size="12" fill="#94A3B8">External job listings source</text>

  <line x1="510" y1="166" x2="510" y2="200" stroke="#22D3EE" stroke-width="2"/>
  <polygon points="503,200 510,213 517,200" fill="#22D3EE"/>

  <!-- 2 fetch_jobs.py -->
  <rect x="370" y="220" width="280" height="76" rx="10" fill="#111827" stroke="#1E293B" stroke-width="0.75"/>
  <text x="510" y="248" text-anchor="middle" font-size="15" font-weight="bold" fill="#FFFFFF" font-family="Consolas, Menlo, monospace">fetch_jobs.py</text>
  <text x="510" y="272" text-anchor="middle" font-size="12" fill="#94A3B8">Extracts postings via Adzuna API</text>

  <line x1="510" y1="296" x2="510" y2="330" stroke="#22D3EE" stroke-width="2"/>
  <polygon points="503,330 510,343 517,330" fill="#22D3EE"/>

  <!-- 3 clean_data.py -->
  <rect x="370" y="350" width="280" height="76" rx="10" fill="#111827" stroke="#1E293B" stroke-width="0.75"/>
  <text x="510" y="378" text-anchor="middle" font-size="15" font-weight="bold" fill="#FFFFFF" font-family="Consolas, Menlo, monospace">clean_data.py</text>
  <text x="510" y="402" text-anchor="middle" font-size="12" fill="#94A3B8">Validates and transforms records</text>

  <line x1="510" y1="426" x2="510" y2="460" stroke="#22D3EE" stroke-width="2"/>
  <polygon points="503,460 510,473 517,460" fill="#22D3EE"/>

  <!-- 4 PostgreSQL (Neon Cloud) -->
  <rect x="370" y="480" width="280" height="76" rx="10" fill="#111827" stroke="#475569" stroke-width="1" stroke-dasharray="5 4"/>
  <text x="510" y="508" text-anchor="middle" font-size="15" font-weight="bold" fill="#FFFFFF">PostgreSQL (Neon Cloud)</text>
  <text x="510" y="532" text-anchor="middle" font-size="12" fill="#94A3B8">Managed structured storage</text>

  <line x1="510" y1="556" x2="510" y2="590" stroke="#22D3EE" stroke-width="2"/>
  <polygon points="503,590 510,603 517,590" fill="#22D3EE"/>

  <!-- 5 Streamlit Dashboard -->
  <rect x="370" y="610" width="280" height="76" rx="10" fill="#111827" stroke="#475569" stroke-width="1" stroke-dasharray="5 4"/>
  <text x="510" y="638" text-anchor="middle" font-size="15" font-weight="bold" fill="#FFFFFF">Streamlit Dashboard</text>
  <text x="510" y="662" text-anchor="middle" font-size="12" fill="#94A3B8">Interactive analytics interface</text>

  <line x1="510" y1="686" x2="510" y2="720" stroke="#22D3EE" stroke-width="2"/>
  <polygon points="503,720 510,733 517,720" fill="#22D3EE"/>

  <!-- 6 Gemini Executive Insight -->
  <rect x="370" y="740" width="280" height="76" rx="10" fill="#111827" stroke="#8B5CF6" stroke-width="1" stroke-dasharray="5 4"/>
  <text x="510" y="768" text-anchor="middle" font-size="15" font-weight="bold" fill="#FFFFFF">Gemini Executive Insight</text>
  <text x="510" y="792" text-anchor="middle" font-size="12" fill="#94A3B8">Narrative layer, not a data source</text>

  <!-- Callout under Gemini -->
  <rect x="310" y="836" width="400" height="42" rx="8" fill="#0F1B2E" stroke="#22D3EE" stroke-width="0.75"/>
  <text x="510" y="857" text-anchor="middle" font-size="12" fill="#67E8F9" font-style="italic">Gemini receives precomputed results only</text>

  <!-- Power BI side branch off PostgreSQL -->
  <text x="900" y="512" text-anchor="middle" font-size="11" fill="#64748B">external analytics</text>
  <line x1="650" y1="518" x2="758" y2="518" stroke="#22D3EE" stroke-width="2"/>
  <polygon points="758,511 771,518 758,525" fill="#22D3EE"/>
  <rect x="780" y="480" width="260" height="76" rx="10" fill="#111827" stroke="#475569" stroke-width="1" stroke-dasharray="5 4"/>
  <text x="910" y="508" text-anchor="middle" font-size="15" font-weight="bold" fill="#FFFFFF">Power BI</text>
  <text x="910" y="532" text-anchor="middle" font-size="12" fill="#94A3B8">Reads directly from PostgreSQL</text>

  <!-- Legend -->
  <line x1="370" y1="895" x2="410" y2="895" stroke="#475569" stroke-width="1" stroke-dasharray="5 4"/>
  <text x="418" y="899" font-size="12" fill="#64748B">external managed service</text>
  <line x1="640" y1="895" x2="680" y2="895" stroke="#1E293B" stroke-width="1"/>
  <text x="688" y="899" font-size="12" fill="#64748B">project code</text>
</svg>
